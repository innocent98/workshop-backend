name: CD (staging)

# push to develop -> build ONCE -> deploy to staging -> live E2E -> mark verified
#
#   build-and-push -> staging-deploy -> staging-e2e -> mark-verified
#
# This is the ONLY workflow that builds and publishes an image. It is also the
# only one that can mark an image "verified", and cd-production.yml refuses to
# deploy an image that is not. Production never builds: it can only redeploy
# the exact bytes built and tested here.
#
# Images are deployed by DIGEST (sha256:...), not by tag. A tag can be moved; a
# digest names exact bytes, so staging and production run identical images.
#
# Manual run with `image_tag` redeploys an existing image to staging instead of
# building (a staging rollback). See docs/deployment/ROLLBACK.md.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ROLLBACK ONLY: redeploy an EXISTING image tag to staging instead of building (e.g. sha-a1b2c3d). Migrations are SKIPPED, so never use this to roll forward to a newer-schema release."
        required: false
        type: string

concurrency:
  # Separate from production so a staging deploy never queues behind a
  # production rollback. Never cancel a half-finished deploy.
  group: workchop-cd-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # A rollback (image_tag given) skips the build. The ref check stops an
    # accidental manual run from another branch; it is not a security control
    # (a branch can edit its own copy of this file). The real control is the
    # `staging` Environment's "Deployment branches" rule: develop only.
    if: github.ref == 'refs/heads/develop' && github.event.inputs.image_tag == ''
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tag
        id: name
        run: |
          # A Docker repository path must be lowercase; github.repository keeps its casing.
          IMAGE="${REGISTRY}/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SHORT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-manifest image, so the digest and retags stay simple.
          provenance: false
          sbom: false

      - name: Resolve the digest
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built ${IMAGE}@${DIGEST}"

  staging-deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # `always()` keeps the rollback path alive (build skipped); the checks stop a
    # failed build from ever reaching the VPS.
    if: >-
      always() &&
      github.ref == 'refs/heads/develop' &&
      needs.build-and-push.result != 'failure' &&
      needs.build-and-push.result != 'cancelled'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read   # lets the VPS pull with this run's own short-lived token
    outputs:
      image_ref: ${{ steps.target.outputs.image_ref }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Choose the image to deploy
        id: target
        env:
          BUILT_REF: ${{ needs.build-and-push.outputs.image_ref }}
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG}" ]; then
            IMAGE="${REGISTRY}/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
            REF="${IMAGE}:${MANUAL_TAG}"
          else
            REF="${BUILT_REF}"
          fi
          # The manual tag is operator-typed text that ends up in `docker pull`
          # on the VPS: it must look like a real image reference.
          if ! printf '%s' "${REF}" | grep -qE '^[a-z0-9./_-]+(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$'; then
            echo "::error::Refusing to deploy malformed image reference: ${REF}"
            exit 1
          fi
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/deploy-stack
        with:
          environment: staging
          image_ref: ${{ steps.target.outputs.image_ref }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_username: ${{ secrets.VPS_USERNAME }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
          vps_ssh_passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          vps_port: ${{ vars.VPS_PORT || 22 }}
          deploy_path: ${{ secrets.DEPLOY_PATH }}
          env_encryption_key: ${{ secrets.ENV_ENCRYPTION_KEY }}
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          # An image_tag dispatch is a rollback: skip alembic (the older image does not know the
          # database's newer revision). Migrations are forward-only; see docs/deployment/ROLLBACK.md.
          run_migrations: ${{ github.event.inputs.image_tag == '' && 'true' || 'false' }}

  staging-e2e:
    name: Live E2E against staging
    runs-on: ubuntu-latest
    needs: [staging-deploy]
    if: needs.staging-deploy.result == 'success'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - run: poetry install --no-interaction --no-root --with dev

      - name: Reset staging rate-limit keys (slowapi/limits keys are prefixed LIMITER)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml exec -T redis sh -lc '
              redis-cli --scan --pattern "LIMITER*" | xargs -r redis-cli DEL >/dev/null
              echo "Staging rate-limit keys cleared"
            ' || echo "Redis flush skipped (no redis service)."

      - name: Run the live E2E suite
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
          E2E_TIMEOUT_SECONDS: '60'
        run: |
          # No tests/e2e directory, or no tests collected (pytest exit 5), counts
          # as a pass so projects without an E2E suite are not blocked. A failing
          # suite blocks promotion.
          if [ ! -d tests/e2e ]; then
            echo "No tests/e2e directory; skipping E2E." | tee staging-api-e2e.log
            exit 0
          fi
          set +e
          poetry run pytest tests/e2e -m e2e -q 2>&1 | tee staging-api-e2e.log
          ec=${PIPESTATUS[0]}
          set -e
          [ "$ec" -eq 5 ] && { echo "No e2e tests collected; treating as success."; exit 0; }
          exit "$ec"

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-api-e2e-logs
          path: staging-api-e2e.log

  mark-verified:
    name: Mark image as staging-verified
    runs-on: ubuntu-latest
    needs: [build-and-push, staging-deploy, staging-e2e]
    # Real builds only (a rollback must not stamp HEAD's name on an old image),
    # and only when build, deploy AND E2E all succeeded.
    if: >-
      github.event_name == 'push' &&
      needs.build-and-push.result == 'success' &&
      needs.staging-deploy.result == 'success' &&
      needs.staging-e2e.result == 'success'
    permissions:
      contents: read
      packages: write
      checks: read   # to read the `CI gate` result for this commit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # WORKCHOP: "verified" must also mean "CI passed for this exact commit". CI (ci.yml) runs on
      # the same push to develop in parallel with this workflow, and the smoke suite is only a
      # handful of read-only checks, so a commit with red tests could otherwise be deployed to
      # staging, stamped verified and fast-forwarded to production. Wait for the `CI gate` check
      # run on this SHA; fail closed if it fails or never appears (re-run this workflow once CI is
      # green). Fine for the first run too: creating `develop` is itself a push that starts CI.
      - name: Require a green CI gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do   # at most 30 minutes
            # A newer commit on develop supersedes this one: stop now instead of polling a CI run
            # that will never finish (ci.yml cancels superseded PR runs). Fail safe: this image is
            # not verified and cannot be promoted; the newer commit's own run verifies that one.
            HEAD_SHA="$(gh api "repos/${REPO}/commits/develop" --jq .sha)"
            if [ "${HEAD_SHA}" != "${SHA}" ]; then
              echo "::error title=Superseded::develop moved on to ${HEAD_SHA}; ${SHA} will not be marked verified. The newer commit's run decides."
              exit 1
            fi
            RUNS="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI gate")] | map({status, conclusion})')"
            N="$(echo "${RUNS}" | jq 'length')"
            PENDING="$(echo "${RUNS}" | jq '[.[] | select(.status != "completed")] | length')"
            OK="$(echo "${RUNS}" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
            RED="$(echo "${RUNS}" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "cancelled" and .conclusion != "skipped")] | length')"
            if [ "${RED}" -gt 0 ]; then
              echo "::error title=CI gate is red::CI gate did not pass for ${SHA}. Not marking this image verified. Fix CI and push; the new commit gets its own run."
              exit 1
            fi
            if [ "${PENDING}" -eq 0 ] && [ "${OK}" -gt 0 ]; then
              echo "CI gate passed for ${SHA}"
              exit 0
            fi
            if [ "${N}" -gt 0 ] && [ "${PENDING}" -eq 0 ] && [ "${OK}" -eq 0 ]; then
              # Every CI gate run for this commit finished cancelled/skipped and none passed:
              # nothing is coming. Re-run CI for the commit, then re-run this workflow.
              echo "::error title=No passing CI gate::Every CI gate run for ${SHA} was cancelled or skipped. Not marking this image verified. Re-run CI for this commit, then re-run this workflow."
              exit 1
            fi
            echo "Waiting for CI gate on ${SHA} (found ${N}, pending ${PENDING}) [${i}/60]"
            sleep 30
          done
          echo "::error title=No CI gate result::No finished 'CI gate' check run for ${SHA} within 30 minutes. Not marking this image verified. Re-run this workflow once CI has finished."
          exit 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the verified tags to the tested image
        env:
          TESTED_REF: ${{ needs.staging-deploy.outputs.image_ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_LC="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${REPO_LC}"

          DIGEST="${TESTED_REF##*@}"
          printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$' || {
            echo "::error::No digest to verify (got '${TESTED_REF}')"; exit 1; }

          # Two tags on the same image:
          #   staging-verified-<full sha>   "was this COMMIT verified?"  (used by the push-to-main path)
          #   verified-sha256-<hex>         "were these BYTES verified?" (used by manual rollbacks)
          TAG_BY_COMMIT="staging-verified-${GITHUB_SHA}"
          TAG_BY_DIGEST="verified-${DIGEST/:/-}"

          # Adds tags to the existing manifest. Nothing is rebuilt or re-pushed.
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG_BY_COMMIT}" \
            --tag "${IMAGE}:${TAG_BY_DIGEST}" \
            "${TESTED_REF}"

          # Prove both tags point at the bytes staging tested.
          for t in "${TAG_BY_COMMIT}" "${TAG_BY_DIGEST}"; do
            GOT="$(./scripts/ghcr_digest.sh "${REPO_LC}" "${t}")"
            [ "${GOT}" = "${DIGEST}" ] || {
              echo "::error::${t} resolves to ${GOT}, not ${DIGEST}"; exit 1; }
            echo "verified: ${t} -> ${GOT}"
          done

          {
            echo "### Staging verified"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| image | \`${DIGEST}\` |"
            echo ""
            echo "To release: fast-forward \`main\` to this commit (see docs/deployment/BRANCHING.md)."
          } >> "$GITHUB_STEP_SUMMARY"
