name: CI

# What runs when (see docs/deployment/BRANCHING.md and docs/sop/deploy-pipeline.md):
#
#   | event               | CI runs                                          |
#   |---------------------|--------------------------------------------------|
#   | PR -> develop/main  | everything (docs-only PRs skip lint/test/image)  |
#   | PR draft            | nothing (mark ready for review to run CI)        |
#   | push to develop     | lint, test, security (safety net)                |
#   | push to main        | nothing                                          |
#
# `main` is deliberately absent from `push`. Promotion to main is a fast-forward of
# develop, so the commit that lands on main is byte-identical to one that already passed
# here and whose image was built and E2E-tested by cd-staging.yml. PRs that target `main`
# directly (only until `develop` exists, or a hotfix) still get the full CI.
#
# Job names `lint` and `test` are the names branch protection already knows: do not
# rename them (the check name is the job's `name`, or its key when it has none).
#
# The release image is NOT published here. CI only proves the Dockerfile builds and is
# free of fixable HIGH/CRITICAL CVEs (PRs only, nothing is pushed). cd-staging.yml is
# the only workflow that publishes an image.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
    # `ready_for_review` so a draft PR runs CI when it is marked ready.
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Cancel superseded PR runs. Never cancel a push to develop: that run is the only
  # safety net a direct push gets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    # Draft PRs run nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Is this more than a docs-only change?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # previous_filename is included so renaming a code file into docs/
          # (or to .md) still counts as a code change.
          gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)' > changed.txt
          # Docs-only = every changed file is under docs/ or is a markdown file.
          if grep -qvE '^docs/|\.md$' changed.txt; then CODE=true; else CODE=false; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  # Lint is its own job so a lint failure never hides the test results.
  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          # poetry.lock is generated by Poetry 2.2.1; keep this pin in step with it.
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - run: poetry install --no-interaction

      # Workchop lints with black + isort + flake8 (line length 100; see pyproject.toml
      # and .flake8), not the template's ruff + black.
      - name: Run linting
        run: |
          poetry run black --check app tests
          poetry run isort --check-only app tests
          poetry run flake8 app tests

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS, not plain postgres: the models use Geography columns.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - run: poetry install --no-interaction

      - name: Apply migrations (schema check)
        # Proves the migration chain builds the real schema on PostGIS: one head,
        # clean upgrade from an empty database.
        env:
          ENVIRONMENT: test
          SERVER_HOST: http://localhost
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          FIRST_SUPERUSER_EMAIL: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword
        run: |
          test "$(poetry run alembic heads | wc -l)" -eq 1
          poetry run alembic upgrade head

      - name: Run tests
        # tests/conftest.py also enables the postgis extension and creates the schema
        # (create_all) when the database is empty, so pytest works with or without the
        # step above. `-m "not e2e"` keeps the live-staging smoke suite (tests/e2e, run
        # by cd-staging.yml against a deployed stack) out of this job.
        # The values are synthetic CI-only ones (as before), so no repo secret is needed.
        env:
          ENVIRONMENT: test
          SERVER_HOST: http://localhost
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          FIRST_SUPERUSER_EMAIL: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword
        run: |
          poetry run pytest -m "not e2e" --cov=app --cov-report=xml --cov-report=html

      - name: Smoke suite against a local server (same tests cd-staging runs live)
        # Boots the app on the migrated CI database and runs tests/e2e against it, so the
        # smoke suite is proven on every PR before it ever gates a staging promotion.
        env:
          ENVIRONMENT: test
          SERVER_HOST: http://localhost
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          FIRST_SUPERUSER_EMAIL: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword
          FCM_ENABLED: "false"
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! poetry run pytest tests/e2e -m e2e -q --no-cov -p no:cacheprovider; then
            echo "--- uvicorn.log ---"; cat uvicorn.log
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  security:
    name: Security (Semgrep)
    needs: [changes]
    # Runs even on docs-only PRs: a pasted secret or a bad snippet lands in docs too.
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: pipx install semgrep

      - name: Run security scan
        run: |
          if [ -x ./scripts/security-scan.sh ]; then
            ./scripts/security-scan.sh
          else
            echo "scripts/security-scan.sh not present; skipping Semgrep."
          fi

  image-check:
    name: Image builds (Trivy)
    # PRs only. A push to develop is followed by cd-staging.yml, which builds the real
    # image and fails before deploying if the build is broken.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: workchop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the finished image, so it sees OS packages too. CVEs with no released fix
      # are ignored (nothing can be upgraded); list accepted exceptions in a
      # .trivyignore file at the repo root. Any fixable HIGH/CRITICAL fails the job.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: workchop-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The one check that always reports. Jobs above are legitimately skipped on a
  # docs-only PR; require THIS check on `develop` (and on `main` if PRs target it),
  # not the individual jobs.
  ci-gate:
    name: CI gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, lint, test, security, image-check]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$BAD" ]; then
            echo "::error::failed or cancelled: $BAD"
            exit 1
          fi
