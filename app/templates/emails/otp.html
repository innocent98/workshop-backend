<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 10px;
        }
        .otp-code {
            background-color: #4F46E5;
            color: white;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 8px;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin: 30px 0;
        }
        .message {
            text-align: center;
            font-size: 16px;
            margin: 20px 0;
        }
        .expiry {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        .warning {
            background-color: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Workchop</div>
            <h2>{{ title }}</h2>
        </div>

        <div class="message">
            <p>{{ message }}</p>
        </div>

        <div class="otp-code">
            {{ otp_code }}
        </div>

        <div class="expiry">
            This code expires in 10 minutes
        </div>

        <div class="warning">
            <strong>Security Notice:</strong> Never share this code with anyone. Workchop will never ask for your OTP code via phone or email.
        </div>

        <div class="footer">
            <p>If you didn't request this code, please ignore this email.</p>
            <p>&copy; 2025 Workchop. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
