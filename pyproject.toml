[tool.poetry]
name = "workchop-api"
version = "0.1.0"
description = "Workshop Backend API"
authors = ["Adebayo Tosin <tosinadebayo55@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core
fastapi = "0.136.3"
uvicorn = {extras = ["standard"], version = "0.32.0"}
pydantic = "2.11.4"
pydantic-settings = "2.9.1"
python-multipart = "0.0.31"
python-dotenv = "1.1.0"

# Security
python-jose = {extras = ["cryptography"], version = "3.5.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
bcrypt = "4.0.1"

# Database
sqlalchemy = "2.0.41"
alembic = "1.15.2"
psycopg2-binary = "2.9.10"
geoalchemy2 = "0.15.2"

# Caching and Rate Limiting
redis = "5.0.0"
slowapi = "0.1.9"

# Logging
loguru = "0.7.3"

# Email
emails = "0.6"
jinja2 = "3.1.6"
email-validator = "2.2.0"

# Utilities
httpx = "0.27.0"
python-dateutil = "2.8.2"
pillow = "13.0.0"

# Background Tasks
celery = "5.4.0"
cloudinary = "1.41.0"
firebase-admin = "6.6.0"

# Production
gunicorn = "23.0.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "8.3.0"
pytest-asyncio = "0.24.0"
pytest-cov = "6.0.0"
pytest-mock = "3.14.0"

# Code Quality
black = "24.10.0"
flake8 = "7.1.0"
mypy = "1.13.0"
isort = "5.13.2"
pylint = "3.3.2"

# Pre-commit
pre-commit = "4.0.0"

# Development
ipython = "8.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
