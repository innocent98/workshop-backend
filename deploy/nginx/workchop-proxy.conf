# /etc/nginx/snippets/workchop-proxy.conf
# Shared reverse-proxy settings for the Workchop API vhosts (production and staging).
# Include it inside a `location` that has `proxy_pass` (see api.workchop.app.conf).

proxy_http_version 1.1;

# The real client IP. The API trusts X-Forwarded-For (uvicorn FORWARDED_ALLOW_IPS=* in
# docker-compose.prod.yml) and slowapi rate-limits per client with it, so nginx must
# OVERWRITE the header with $remote_addr, never append to one the client sent
# ($proxy_add_x_forwarded_for would let a caller spoof any IP and dodge the login limits).
# If you ever put Cloudflare or a load balancer in front, switch to the realip module.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket-safe: the API has no websocket routes today, but if one is added these make it
# work without touching nginx. Connection is "upgrade" only when the client asks for it, so
# ordinary requests still reuse keep-alive connections to the upstream.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts: mobile networks are slow and portfolio uploads are multipart; Paystack/Dojah
# calls made by the API on a request can take several seconds.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Uploads go straight through to the app (it enforces 5 MB profile / 10 MB portfolio images
# per file); do not buffer a whole request body to disk first for small bodies.
proxy_request_buffering on;
