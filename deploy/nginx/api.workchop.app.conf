# /etc/nginx/sites-available/workchop-api   (production: api.workchop.app)
#
# This is the HTTP-ONLY starting point. `certbot --nginx` then adds the 443 server block,
# the certificate paths and the HTTP->HTTPS redirect for you (see the checklist / deployment
# guide). It proxies to the API container, which listens on 127.0.0.1:8000 only
# (API_PORT in .env.production). Keep the port in step with API_PORT.
#
# Webhook paths that MUST stay reachable from the internet, unauthenticated at the edge
# (the app verifies the provider signature on each):
#   POST /api/v1/payments/webhook       Paystack  (x-paystack-signature)
#   POST /api/v1/verification/webhook   Dojah     (x-dojah-signature)
# Both are covered by `location /` below; do not add auth_basic / IP allow-lists to them.

# needs $connection_upgrade from /etc/nginx/conf.d/websocket-upgrade.conf (installed once)
upstream workchop_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.workchop.app;

    # Portfolio images are up to 10 MB each (app limit) plus multipart overhead.
    client_max_body_size 15m;

    location / {
        proxy_pass http://workchop_api;
        include /etc/nginx/snippets/workchop-proxy.conf;
    }

    # Cheap liveness probe for uptime monitors; never logged.
    location = /health {
        proxy_pass http://workchop_api;
        include /etc/nginx/snippets/workchop-proxy.conf;
        access_log off;
    }
}
