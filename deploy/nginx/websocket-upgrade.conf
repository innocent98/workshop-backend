# /etc/nginx/conf.d/websocket-upgrade.conf   (install ONCE per VPS, http context)
# Used by workchop-proxy.conf. `Connection` is "upgrade" only when the client asked for a
# websocket; otherwise it is unset, which keeps upstream keep-alive connections reusable.
# If another vhost on this VPS already defines $connection_upgrade, skip this file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
